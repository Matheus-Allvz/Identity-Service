name: identity-infra

networks:
  identity-net:
    name: identity-net
    external: true

volumes:
  identity_postgres_data:
    name: identity_postgres_data
  identity_redis_data:
    name: identity_redis_data
  identity_kafka_data:
    name: identity_kafka_data

services:
  postgres:
    image: postgres:17.6
    container_name: identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity-test
    volumes:
      - identity_postgres_data:/var/lib/postgresql/data
    networks:
      identity-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U identity -d identity"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7.4.6
    container_name: identity-redis
    restart: unless-stopped
    volumes:
      - identity_redis_data:/data
    networks:
      identity-net:
        aliases:
          - redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  kafka:
    image: apache/kafka:3.9.1
    container_name: identity-kafka
    restart: unless-stopped
    volumes:
      - identity_kafka_data:/var/lib/kafka/data
    networks:
      identity-net:
        aliases:
          - kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 24
