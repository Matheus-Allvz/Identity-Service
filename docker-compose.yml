services:
  identity-service-blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: identity-service:latest
    container_name: identity-service-blue
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - identity-net
    environment:
      <<: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30

  identity-service-green:
    build:
      context: .
      dockerfile: Dockerfile
    image: identity-service:latest
    container_name: identity-service-green
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    networks:
      - identity-net
    environment:
      <<: *app-environment
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30
